apiVersion: apps/v1
kind: Deployment
metadata:
  name: norish
spec:
  replicas: 1
  # the uploads volume is ReadWriteOnce, and the scheduled tasks must not run twice
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: norish
  template:
    metadata:
      labels:
        app: norish
    spec:
      enableServiceLinks: false
      # Starting as 1000 skips the entrypoint's root-only chown of the uploads
      # folder; fsGroup makes the volume writable instead.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: norish
          image: norishapp/norish:v0.26.1-beta
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            # provided by each overlay
            - configMapRef:
                name: norish-config
          env:
            # generated by the CNPG Cluster norish-db in the same namespace
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: norish-db-app
                  key: uri
            # Never change MASTER_KEY: stored secrets can't be decrypted without it.
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: norish-secrets
                  key: MASTER_KEY
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: norish-secrets
                  key: AI_API_KEY
            - name: OBSCURA_CDP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: norish-secrets
                  key: OBSCURA_CDP_TOKEN
          # migrations run on startup, so give the first probe time
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          # database and Valkey
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # the server and its parser child process only
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: norish-uploads
        - name: tmp
          emptyDir: {}
