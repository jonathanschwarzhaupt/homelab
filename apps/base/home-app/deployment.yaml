apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-app
spec:
  # Exactly one replica: the in-process banking loop must never run twice
  # (home-app ADR 0002). Recreate stops the old pod before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-app
  template:
    metadata:
      labels:
        app: home-app
    spec:
      enableServiceLinks: false
      # HTTP shutdown (10s) plus background work stop (25s), with headroom
      terminationGracePeriodSeconds: 45
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: home-app
          image: ghcr.io/jonathanschwarzhaupt/home-app
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            # provided by each overlay
            - configMapRef:
                name: home-app-config
            - secretRef:
                name: home-app-secrets
          env:
            # generated by the CNPG Cluster home-app-db in the same namespace
            - name: DB_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: home-app-db-app
                  key: uri
          # migrations run on startup, so give the first probe time
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
