apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: home-blog
spec:
  instances: 3
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  bootstrap:
    initdb:
      database: blog
      owner: blog

  storage:
    size: 1Gi
    storageClass: synology-csi-iscsi-retain

  # Replicas use replication slots and recovery reads WAL from the Azure
  # archive, so CNPG's default wal_keep_size (512MB) protects nothing here.
  postgresql:
    parameters:
      wal_keep_size: "64MB"
      max_wal_size: "256MB"

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: home-blog-objectstore
