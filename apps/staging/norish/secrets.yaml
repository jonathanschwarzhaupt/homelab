# One item for every consumer; each one picks only the keys it needs:
# norish:      MASTER_KEY, AI_API_KEY, OBSCURA_CDP_TOKEN
# obscura:     OBSCURA_CDP_TOKEN
# cloudflared: credentials.json
# backups:     STORAGE_ACCOUNT_NAME, STORAGE_ACCOUNT_SAS_TOKEN
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: norish-secrets
  annotations:
    operator.1password.io/auto-restart: "true"
spec:
  itemPath: "vaults/apps/items/norish-secrets"
