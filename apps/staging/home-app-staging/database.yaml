apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: home-app-db
spec:
  # single node cluster: more instances would add no availability
  instances: 1
  # match the major version home-app is tested against
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-system-trixie
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"

  bootstrap:
    initdb:
      database: homeapp
      owner: homeapp

  # the storage class allows expansion: raise the size to grow in place
  storage:
    size: 1Gi
    storageClass: synology-csi-iscsi-retain
