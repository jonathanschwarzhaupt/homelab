apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-app-staging
resources:
  - namespace.yaml
  - ../../base/home-app
  - secrets.yaml
  - database.yaml
  - podmonitor-db.yaml
  - ingress.yaml
  - image-automation.yaml
# the hash suffix restarts the pod when the config changes
configMapGenerator:
  - name: home-app-config
    envs:
      - config.env
images:
  - name: ghcr.io/jonathanschwarzhaupt/home-app
    newTag: main-20261108134031-ca591c7 # {"$imagepolicy": "home-app-staging:home-app:tag"}
