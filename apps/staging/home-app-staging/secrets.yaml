# The Secret names are fixed by the base; the 1Password items are per environment.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: home-app-secrets
  annotations:
    operator.1password.io/auto-restart: "true"
spec:
  itemPath: "vaults/apps/items/home-app-staging-secrets"
---
# Single field ".dockerconfigjson"; a classic PAT with read:packages only.
# Used by the kubelet (imagePullSecrets) and the ImageRepository.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: ghcr-pull
type: kubernetes.io/dockerconfigjson
spec:
  itemPath: "vaults/apps/items/ghcr-pull"
