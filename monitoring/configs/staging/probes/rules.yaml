apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blackbox
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: blackbox
      rules:
        - alert: ServiceDown
          expr: probe_success{job="blackbox"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} is down"
            description: "The blackbox probe of {{ $labels.instance }} fails for 3 minutes or more."
        - alert: ServiceSlow
          expr: avg_over_time(probe_duration_seconds{job="blackbox"}[10m]) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} is slow"
            description: "The average probe time of {{ $labels.instance }} is {{ $value | humanizeDuration }} (limit: 2s)."
        - alert: BlackboxProbesMissing
          expr: absent(probe_success{job="blackbox"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "No blackbox probe results"
            description: "Prometheus gets no probe_success metrics. Examine the blackbox-exporter pod and the Probe resources."
