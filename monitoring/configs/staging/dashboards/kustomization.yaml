apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
# Dashboards loaded by the Grafana sidecar of kube-prometheus-stack, which picks
# up ConfigMaps labelled grafana_dashboard=1 in any namespace. Each JSON is
# pinned to an upstream version; update one by replacing its file.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  # cloudnative-pg/grafana-dashboards@47e4c51. Unlike the one bundled in the
  # cnpg chart, it reads the barman-cloud plugin's backup metrics.
  - name: cnpg-grafana-dashboard
    files:
      - cnpg.json
  # dotdc/grafana-dashboards-kubernetes v3.0.8 (grafana.com 15757-15760)
  - name: k8s-views-global
    files:
      - k8s-views-global.json
  - name: k8s-views-namespaces
    files:
      - k8s-views-namespaces.json
  - name: k8s-views-nodes
    files:
      - k8s-views-nodes.json
  - name: k8s-views-pods
    files:
      - k8s-views-pods.json
  # rfmoz/grafana-dashboards@b07d8a9 (grafana.com 1860)
  - name: node-exporter-full
    files:
      - node-exporter-full.json
