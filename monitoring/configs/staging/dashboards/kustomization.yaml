apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
# Dashboards loaded by the Grafana sidecar of kube-prometheus-stack, which picks
# up ConfigMaps labelled grafana_dashboard=1 in any namespace. Each JSON is
# pinned to an upstream version; update one by replacing its file.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  # cloudnative-pg/grafana-dashboards@47e4c51. Unlike the one bundled in the
  # cnpg chart, it reads the barman-cloud plugin's backup metrics.
  - name: cnpg-grafana-dashboard
    files:
      - cnpg.json
