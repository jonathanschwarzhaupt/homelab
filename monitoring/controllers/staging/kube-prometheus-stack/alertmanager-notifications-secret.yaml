# Keys: ntfy-url, healthchecks-url. Mounted into Alertmanager at
# /etc/alertmanager/secrets/alertmanager-notifications/<key>.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: alertmanager-notifications
  annotations:
    operator.1password.io/auto-restart: "true"
spec:
  itemPath: "vaults/apps/items/alertmanager-notifications"
