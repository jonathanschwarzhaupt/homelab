apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  # namespace: renovate
spec:
  schedule: "@hourly"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: renovate
              # pinned: :latest pulled a new image almost every hourly run.
              # Renovate bumps this itself once a week (renovate.json).
              image: renovate/renovate:44.222.4
              args:
                - jonathanschwarzhaupt/homelab

              envFrom:
                - secretRef:
                    name: renovate-container-env
                - configMapRef:
                    name: renovate-configmap

          restartPolicy: Never
