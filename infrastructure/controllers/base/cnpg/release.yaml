apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.x"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: cnpg-system
      interval: 12h
  values:
    monitoring:
      podMonitorEnabled: true
      # kube-prometheus-stack only selects monitors with this label
      podMonitorAdditionalLabels:
        release: kube-prometheus-stack
      # picked up by the Grafana sidecar, which watches all namespaces
      grafanaDashboard:
        create: true
